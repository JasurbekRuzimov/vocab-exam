# /etc/nginx/sites-available/vocabexam
# DOMEN.UZ ni o'z domeningizga almashtiring. HTTPS sertifikatini certbot qo'shadi:
#   sudo certbot --nginx -d DOMEN.UZ -d www.DOMEN.UZ
server {
    listen 80;
    server_name DOMEN.UZ www.DOMEN.UZ;

    client_max_body_size 10M;   # so'z fayllari va logotip yuklash uchun

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
