# /etc/nginx/sites-available/examaker
# HTTPS sertifikatini certbot qo'shadi:
#   sudo certbot --nginx -d examaker.uz -d www.examaker.uz
server {
    listen 80;
    server_name examaker.uz www.examaker.uz;

    client_max_body_size 10M;   # so'z fayllari va logotip yuklash uchun

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
