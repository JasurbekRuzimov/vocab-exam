<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Guruhlar')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">Guruhlar</h4>
    <a th:href="@{/admin/groups/new}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Yangi guruh</a>
  </div>
  <div class="row g-3">
    <div class="col-sm-6 col-lg-4" th:each="g : ${groups}">
      <a th:href="@{'/admin/groups/' + ${g.id}}" class="card border-0 shadow-sm text-decoration-none text-dark h-100 d-block">
        <div class="card-body">
          <h6 class="fw-bold" th:text="${g.name}"></h6>
          <small class="text-muted d-block">O'qituvchi: <span th:text="${g.teacher.fullName}"></span></small>
          <span class="badge bg-primary-subtle text-primary mt-2"
                th:text="${#sets.size(g.students)} + ' o\'quvchi'"></span>
        </div>
      </a>
    </div>
    <div th:if="${#lists.isEmpty(groups)}" class="col-12 text-center text-muted py-4">Guruh yo'q</div>
  </div>
</main></body>
</html>
