<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Imtihonlar')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">Imtihonlar</h4>
    <a th:href="@{/teacher/exams/create}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Yangi imtihon</a>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Sarlavha</th><th>Turi</th><th>Savollar</th><th>Holat</th><th>Sana</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="e : ${exams}">
            <td class="fw-semibold">
              <a th:href="@{'/teacher/exams/' + ${e.id}}" th:text="${e.title}" class="text-decoration-none"></a>
            </td>
            <td><span class="badge" th:classappend="${e.type.name() == 'PDF'} ? 'bg-warning text-dark' : 'bg-info text-dark'" th:text="${e.type}"></span></td>
            <td th:text="${e.questionCount}"></td>
            <td><span class="badge" th:classappend="${e.status.name() == 'GENERATED'} ? 'bg-success' : 'bg-secondary'" th:text="${e.status}"></span></td>
            <td class="small text-muted" th:text="${#temporals.format(e.createdAt,'dd.MM.yyyy')}"></td>
            <td><a th:href="@{'/teacher/exams/' + ${e.id}}" class="btn btn-sm btn-outline-secondary py-0"><i class="bi bi-eye"></i></a></td>
          </tr>
          <tr th:if="${#lists.isEmpty(exams)}">
            <td colspan="6" class="text-center text-muted py-4">Imtihon yo'q</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main></body>
</html>
