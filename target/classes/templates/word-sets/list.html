<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'So\'zlar to\'plamlari')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">So'zlar to'plamlari</h4>
    <a th:href="@{/teacher/word-sets/upload}" class="btn btn-primary btn-sm"><i class="bi bi-upload me-1"></i>Yangi yuklash</a>
  </div>
  <div class="row g-3" th:if="${!#lists.isEmpty(wordSets)}">
    <div class="col-sm-6 col-lg-4" th:each="ws : ${wordSets}">
      <a th:href="@{'/teacher/word-sets/' + ${ws.id}}" class="card border-0 shadow-sm text-decoration-none text-dark h-100 d-block">
        <div class="card-body">
          <div class="d-flex align-items-start gap-2">
            <i class="bi bi-file-word-fill text-primary fs-4"></i>
            <div class="flex-grow-1 overflow-hidden">
              <div class="fw-semibold text-truncate" th:text="${ws.name}"></div>
              <small class="text-muted">
                <span th:if="${ws.fileName != null}" th:text="${ws.fileName}"></span>
                <span th:unless="${ws.fileName != null}">Qo'lda kiritilgan</span>
              </small>
            </div>
          </div>
          <div class="mt-2 d-flex gap-2 align-items-center">
            <span class="badge bg-primary-subtle text-primary" th:text="${#lists.size(ws.words)} + ' so\'z'"></span>
            <small class="text-muted ms-auto" th:text="${#temporals.format(ws.createdAt,'dd.MM.yyyy')}"></small>
          </div>
        </div>
      </a>
    </div>
  </div>
  <div th:if="${#lists.isEmpty(wordSets)}" class="text-center py-5 text-muted">
    <i class="bi bi-folder2-open fs-1 d-block mb-3"></i>
    <p>Hali so'zlar to'plami yo'q</p>
    <a th:href="@{/teacher/word-sets/upload}" class="btn btn-primary">Birinchi to'plamni yuklash</a>
  </div>
</main></body>
</html>
