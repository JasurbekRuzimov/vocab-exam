<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Topshirishlar')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h5 class="fw-bold mb-0" th:text="${assignment.exam.title}"></h5>
      <small class="text-muted">Topshirishlar</small>
    </div>
    <a th:href="@{/teacher/exams}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Orqaga</a>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>O'quvchi</th><th>Email</th><th>Holat</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="student : ${submitted}">
            <td class="fw-semibold" th:text="${student.fullName}"></td>
            <td class="text-muted small" th:text="${student.email}"></td>
            <td><span class="badge bg-success">Topshirildi</span></td>
            <td class="text-end">
              <a th:href="@{'/teacher/exams/' + ${assignment.id} + '/submissions/' + ${student.id} + '/check'}"
                 class="btn btn-sm btn-primary py-0"><i class="bi bi-check-square me-1"></i>Tekshirish</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(submitted)}">
            <td colspan="4" class="text-center text-muted py-4">Hali hech kim topshirmagan</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main></body>
</html>
