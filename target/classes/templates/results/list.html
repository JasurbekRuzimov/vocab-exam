<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Natijalarim')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <h4 class="fw-bold mb-4">Natijalarim</h4>
  <div class="card border-0 shadow-sm" th:if="${!#lists.isEmpty(results)}">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Imtihon</th><th>Ball</th><th>Sana</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="r : ${results}">
            <td class="fw-semibold" th:text="${r.assignment.exam.title}"></td>
            <td>
              <span class="fw-bold text-primary" th:text="${r.totalScore}"></span>/<span th:text="${r.maxScore}"></span>
              <div class="progress mt-1" style="height:4px;width:80px">
                <div class="progress-bar bg-success" th:style="'width:' + ${r.maxScore > 0 ? (r.totalScore * 100 / r.maxScore) : 0} + '%'"></div>
              </div>
            </td>
            <td class="small text-muted" th:text="${#temporals.format(r.checkedAt,'dd.MM.yyyy')}"></td>
            <td><a th:href="@{'/student/results/' + ${r.id}}" class="btn btn-sm btn-outline-primary py-0">Ko'rish</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div th:if="${#lists.isEmpty(results)}" class="text-center py-5 text-muted">
    <i class="bi bi-bar-chart fs-1 d-block mb-3"></i><p>Hali natija yo'q</p>
  </div>
</main></body>
</html>
