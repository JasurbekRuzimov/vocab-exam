<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, ${user == null ? 'Yangi foydalanuvchi' : 'Tahrirlash'})}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4" th:text="${user == null ? 'Yangi foydalanuvchi' : 'Tahrirlash'}"></h5>
          <form th:action="${user == null ? '/admin/users' : '/admin/users/' + user.id + '/update'}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
              <label class="form-label">To'liq ism *</label>
              <input type="text" name="fullName" class="form-control" required th:value="${user?.fullName}">
            </div>
            <div class="mb-3">
              <label class="form-label">Email *</label>
              <input type="email" name="email" class="form-control" required th:value="${user?.email}">
            </div>
            <div th:if="${user == null}" class="mb-3">
              <label class="form-label">Parol *</label>
              <input type="password" name="password" class="form-control" required minlength="8">
            </div>
            <div class="mb-4">
              <label class="form-label">Rol *</label>
              <select name="role" class="form-select" required>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                        th:selected="${user != null and r == user.role}"></option>
              </select>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Saqlash</button>
              <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Bekor qilish</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main></body>
</html>
