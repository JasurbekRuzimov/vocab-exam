<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, ${group.name})}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-0" th:text="${group.name}"></h4>
      <small class="text-muted">O'qituvchi: <span th:text="${group.teacher.fullName}"></span></small>
    </div>
    <div class="d-flex gap-2 flex-shrink-0">
      <button class="btn btn-outline-secondary btn-sm" title="Tahrirlash" data-bs-toggle="modal" data-bs-target="#editGroupModal">
        <i class="bi bi-pencil"></i></button>
      <button class="btn btn-outline-danger btn-sm" title="Guruhni o'chirish"
              th:data-api-url="@{'/api/groups/' + ${group.id}}" data-api-method="DELETE" th:data-redirect="@{/admin/groups}"
              data-confirm="Guruh o'chirilsinmi? O'quvchilar akkauntlari va oldingi natijalar saqlanib qoladi.">
        <i class="bi bi-trash"></i></button>
      <a th:href="@{/admin/groups}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Orqaga</a>
    </div>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <span class="fw-semibold">O'quvchilar (<span th:text="${#sets.size(group.students)}"></span>)</span>
      <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">
        <i class="bi bi-person-plus me-1"></i>Qo'shish
      </button>
    </div>
    <div class="table-responsive">
      <table class="table mb-0 align-middle">
        <tbody>
          <tr th:each="s : ${group.students}">
            <td class="fw-semibold" th:text="${s.fullName}"></td>
            <td class="text-muted small" th:text="${s.username}"></td>
            <td class="text-end">
              <button class="btn btn-sm text-danger p-1 border-0 bg-transparent remove-student"
                      th:data-student-id="${s.id}" th:data-group-id="${group.id}">
                <i class="bi bi-person-dash"></i>
              </button>
            </td>
          </tr>
          <tr th:if="${#sets.isEmpty(group.students)}">
            <td colspan="3" class="text-center text-muted py-3">O'quvchi yo'q</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="modal fade" id="addStudentModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">O'quvchi qo'shish</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <select id="studentSelect" class="form-select" multiple size="8">
          <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.fullName} + ' (' + ${s.username} + ')'"></option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary btn-sm" id="addStudentsBtn" th:data-group-id="${group.id}">Qo'shish</button>
      </div>
    </div></div>
  </div>
  <div class="modal fade" id="editGroupModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Guruhni tahrirlash</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <label class="form-label small text-muted mb-1">Nomi</label>
        <input type="text" id="groupName" class="form-control mb-3" th:value="${group.name}">
        <label class="form-label small text-muted mb-1">O'qituvchi</label>
        <select id="groupTeacher" class="form-select">
          <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.fullName}" th:selected="${t.id == group.teacher.id}"></option>
        </select>
        <div id="editGroupError" class="text-danger small mt-2"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary btn-sm" id="saveGroupBtn" th:data-url="@{'/api/groups/' + ${group.id}}">Saqlash</button>
      </div>
    </div></div>
  </div>
  <script>
    async function failMessage(res) { return (await res.json().catch(() => ({}))).message || 'Xato yuz berdi'; }
    document.getElementById('saveGroupBtn').addEventListener('click', async e => {
      const name = document.getElementById('groupName').value.trim();
      if (!name) return;
      const res = await fetch(e.target.dataset.url, {method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name, teacherId: document.getElementById('groupTeacher').value})});
      if (res.ok) location.reload();
      else document.getElementById('editGroupError').textContent = await failMessage(res);
    });
    document.getElementById('addStudentsBtn').addEventListener('click', async () => {
      const gid = document.getElementById('addStudentsBtn').dataset.groupId;
      const ids = [...document.getElementById('studentSelect').selectedOptions].map(o => o.value);
      if (!ids.length) return;
      const res = await fetch('/api/groups/'+gid+'/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentIds:ids})});
      if (res.ok) location.reload(); else alert(await failMessage(res));
    });
    document.querySelectorAll('.remove-student').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('O\'quvchi guruhdan chiqarilsinmi?')) return;
        const {groupId, studentId} = btn.dataset;
        const res = await fetch('/api/groups/'+groupId+'/students/'+studentId,{method:'DELETE'});
        if (res.ok) location.reload(); else alert(await failMessage(res));
      });
    });
  </script>
</main></body>
</html>
