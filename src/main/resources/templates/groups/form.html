<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Yangi guruh')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card border-0 shadow-sm p-4">
        <h5 class="fw-bold mb-4">Yangi guruh</h5>
        <form th:action="@{/admin/groups}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Guruh nomi *</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">O'qituvchi *</label>
            <select name="teacherId" class="form-select" required>
              <option value="">— tanlang —</option>
              <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.fullName}"></option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Saqlash</button>
            <a th:href="@{/admin/groups}" class="btn btn-outline-secondary">Bekor qilish</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main></body>
</html>
