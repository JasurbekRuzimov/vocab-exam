<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, ${center == null ? 'Yangi markaz' : 'Markazni tahrirlash'})}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4" th:text="${center == null ? 'Yangi o''quv markazi' : center.name}"></h5>
          <div class="alert alert-danger small py-2" th:if="${error}" th:text="${error}"></div>
          <form th:action="${center == null ? '/admin/centers' : '/admin/centers/' + center.id + '/update'}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
              <label class="form-label">Markaz nomi *</label>
              <input type="text" name="name" class="form-control" required maxlength="255"
                     placeholder="masalan: Ilm Ziyo o'quv markazi" th:value="${center?.name ?: form?.name}">
            </div>
            <div class="mb-3" th:if="${center == null}">
              <label class="form-label">Qisqa nom *</label>
              <input type="text" name="slug" class="form-control" required pattern="[a-z0-9\-]{2,50}"
                     autocapitalize="none" spellcheck="false" placeholder="masalan: ilmziyo" th:value="${form?.slug}">
              <div class="form-text">Lotin kichik harflari, raqamlar va -. Keyin o'zgartirib bo'lmaydi.</div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-sm-8">
                <label class="form-label">Logotip havolasi <span class="text-muted">(ixtiyoriy)</span></label>
                <input type="url" name="logoUrl" class="form-control" placeholder="https://…/logo.png"
                       th:value="${center?.logoUrl ?: form?.logoUrl}">
              </div>
              <div class="col-sm-4">
                <label class="form-label">Asosiy rang</label>
                <input type="color" name="primaryColor" class="form-control form-control-color w-100"
                       th:value="${center?.primaryColor ?: (form?.primaryColor ?: '#1E3A5F')}">
              </div>
            </div>

            <th:block th:if="${center == null}">
              <hr>
              <h6 class="fw-semibold mb-1">Markaz direktori</h6>
              <p class="small text-muted">Direktor o'z markazida o'qituvchi, o'quvchi va guruhlarni o'zi qo'shadi.</p>
              <div class="mb-3">
                <label class="form-label">To'liq ism</label>
                <input type="text" name="directorName" class="form-control" th:value="${form?.directorName}">
              </div>
              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label class="form-label">Login *</label>
                  <input type="text" name="directorUsername" class="form-control" required
                         pattern="[A-Za-z0-9._\-]{3,50}" autocapitalize="none" spellcheck="false"
                         placeholder="masalan: ilmziyo.admin" th:value="${form?.directorUsername}">
                </div>
                <div class="col-sm-6">
                  <label class="form-label">Parol *</label>
                  <input type="password" name="directorPassword" class="form-control" required minlength="6">
                </div>
              </div>
            </th:block>

            <div class="d-flex gap-2 mt-2">
              <button type="submit" class="btn btn-primary">Saqlash</button>
              <a th:href="@{/admin/centers}" class="btn btn-outline-secondary">Bekor qilish</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main></body>
</html>
