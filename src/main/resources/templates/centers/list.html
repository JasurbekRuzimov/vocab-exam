<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'O\'quv markazlari')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">O'quv markazlari</h4>
    <a th:href="@{/admin/centers/new}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Yangi markaz</a>
  </div>
  <div class="alert alert-success small py-2" th:if="${success}" th:text="${success}"></div>
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Markaz</th><th>Qisqa nom</th><th>Direktor</th><th>O'qituvchi</th><th>O'quvchi</th><th>Holat</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="r : ${rows}">
            <td>
              <div class="d-flex align-items-center gap-2">
                <span class="d-inline-block rounded" style="width:14px;height:14px"
                      th:style="'width:14px;height:14px;background:' + ${r.center.primaryColor}"></span>
                <img th:if="${r.center.logoUrl}" th:src="${r.center.logoUrl}" alt="" style="height:22px;max-width:60px;object-fit:contain">
                <span class="fw-semibold" th:text="${r.center.name}"></span>
              </div>
            </td>
            <td class="text-muted small" th:text="${r.center.slug}"></td>
            <td th:text="${r.directors}"></td>
            <td th:text="${r.teachers}"></td>
            <td th:text="${r.students}"></td>
            <td>
              <span th:if="${r.center.active}" class="badge bg-success-subtle text-success">Faol</span>
              <span th:unless="${r.center.active}" class="badge bg-danger-subtle text-danger">To'xtatilgan</span>
            </td>
            <td class="text-end text-nowrap">
              <a th:href="@{'/admin/users?centerId=' + ${r.center.id}}" class="btn btn-sm btn-outline-secondary py-0" title="Foydalanuvchilar"><i class="bi bi-people"></i></a>
              <a th:href="@{'/admin/centers/' + ${r.center.id} + '/edit'}" class="btn btn-sm btn-outline-secondary py-0" title="Tahrirlash"><i class="bi bi-pencil"></i></a>
              <form th:action="@{'/admin/centers/' + ${r.center.id} + '/active'}" method="post" class="d-inline"
                    th:classappend="${r.center.active} ? 'confirm-off' : ''">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="active" th:value="${!r.center.active}">
                <button class="btn btn-sm py-0" th:classappend="${r.center.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                        th:text="${r.center.active} ? 'To\'xtatish' : 'Yoqish'"></button>
              </form>
              <form th:action="@{'/admin/centers/' + ${r.center.id} + '/delete'}" method="post" class="d-inline confirm-delete">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-danger py-0" title="Markazni o'chirish (faqat bo'sh markaz)"><i class="bi bi-trash"></i></button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(rows)}">
            <td colspan="7" class="text-center text-muted py-4">Hali markaz yo'q</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script>
    document.querySelectorAll('form.confirm-off').forEach(f => f.addEventListener('submit', e => {
      if (!confirm("Markaz to'xtatilsa, uning foydalanuvchilari tizimga kira olmaydi. Davom etasizmi?")) e.preventDefault();
    }));
    document.querySelectorAll('form.confirm-delete').forEach(f => f.addEventListener('submit', e => {
      if (!confirm("Markaz butunlay o'chirilsinmi? Faqat foydalanuvchisi yo'q markazni o'chirish mumkin.")) e.preventDefault();
    }));
  </script>
</main></body>
</html>
