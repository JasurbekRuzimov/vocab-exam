<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Bildirishnomalar')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">Bildirishnomalar</h4>
    <form th:if="${unreadCount != null and unreadCount > 0}" th:action="@{/notifications/read-all}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-check2-all me-1"></i>Hammasini o'qildi</button>
    </form>
  </div>
  <div class="list-group shadow-sm" th:unless="${#lists.isEmpty(notifications)}">
    <a th:each="n : ${notifications}" th:href="@{'/notifications/' + ${n.id} + '/open'}"
       class="list-group-item list-group-item-action d-flex align-items-start gap-3 py-3"
       th:classappend="${n.read} ? '' : 'border-start border-primary border-3'">
      <i class="bi mt-1" th:classappend="${n.type.name() == 'RESULT_READY'} ? 'bi-bar-chart text-success'
         : (${n.type.name() == 'EXAM_SUBMITTED'} ? 'bi-inbox text-warning' : 'bi-journal-check text-primary')"></i>
      <div class="flex-grow-1">
        <div th:classappend="${n.read} ? 'text-muted' : 'fw-semibold'" th:text="${n.message}"></div>
        <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'dd.MM.yyyy HH:mm')}"></small>
      </div>
      <span th:unless="${n.read}" class="badge bg-primary rounded-pill">yangi</span>
    </a>
  </div>
  <div th:if="${#lists.isEmpty(notifications)}" class="text-center text-muted py-5">
    <i class="bi bi-bell-slash fs-1 d-block mb-2"></i>Hozircha bildirishnoma yo'q
  </div>
</main></body>
</html>
