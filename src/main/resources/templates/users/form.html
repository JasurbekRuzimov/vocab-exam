<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, ${user == null ? 'Yangi foydalanuvchi' : 'Tahrirlash'})}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4" th:text="${user == null ? 'Yangi foydalanuvchi' : 'Tahrirlash'}"></h5>
          <form th:action="${user == null ? '/admin/users' : '/admin/users/' + user.id + '/update'}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
              <label class="form-label">To'liq ism *</label>
              <input type="text" name="fullName" class="form-control" required th:value="${user?.fullName}">
            </div>
            <div class="mb-3">
              <label class="form-label">Login *</label>
              <input type="text" name="username" class="form-control" required
                     pattern="[A-Za-z0-9._\-]{3,50}" autocapitalize="none" spellcheck="false"
                     placeholder="masalan: ali.valiyev" th:value="${user?.username}">
              <div class="form-text">Lotin harflari, raqamlar, nuqta, _ yoki -. Foydalanuvchi shu login bilan kiradi.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email <span class="text-muted">(ixtiyoriy)</span></label>
              <input type="email" name="email" class="form-control" th:value="${user?.email}">
            </div>
            <div th:if="${user == null}" class="mb-3">
              <label class="form-label">Parol *</label>
              <input type="password" name="password" class="form-control" required minlength="6">
            </div>
            <div class="mb-4">
              <label class="form-label">Rol *</label>
              <select name="role" id="roleSelect" class="form-select" required>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}"
                        th:selected="${user != null ? r == user.role : r.name() == 'STUDENT'}"></option>
              </select>
            </div>
            <!-- Platforma admini foydalanuvchi qaysi markazga tegishli ekanini tanlaydi -->
            <div class="mb-4" id="centerField" th:if="${centers != null}">
              <label class="form-label">Markaz *</label>
              <select name="centerId" class="form-select">
                <option th:each="c : ${centers}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${user != null and c.id == user.centerId}"></option>
              </select>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Saqlash</button>
              <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Bekor qilish</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script>
    // Platforma admini markazga tegishli emas
    const roleSel = document.getElementById('roleSelect'), centerField = document.getElementById('centerField');
    function syncCenter() { if (centerField) centerField.classList.toggle('d-none', roleSel.value === 'SUPER_ADMIN'); }
    roleSel.addEventListener('change', syncCenter); syncCenter();
  </script>
</main></body>
</html>
