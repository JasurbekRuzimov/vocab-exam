<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Foydalanuvchilar')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">Foydalanuvchilar</h4>
    <a th:href="@{/admin/users/new}" class="btn btn-primary btn-sm"><i class="bi bi-person-plus me-1"></i>Yangi</a>
  </div>
  <div class="card border-0 shadow-sm mb-3 p-2">
    <form method="get" class="row g-2 align-items-end">
      <div class="col-auto">
        <select name="role" class="form-select form-select-sm">
          <option value="">Barcha rollar</option>
          <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}" th:selected="${r == filter_role}"></option>
        </select>
      </div>
      <div class="col-auto" th:if="${centers != null}">
        <select name="centerId" class="form-select form-select-sm">
          <option value="">Barcha markazlar</option>
          <option th:each="c : ${centers}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == filter_center}"></option>
        </select>
      </div>
      <div class="col">
        <input type="text" name="search" class="form-control form-control-sm" placeholder="Ism, login yoki email…" th:value="${filter_search}">
      </div>
      <div class="col-auto"><button class="btn btn-outline-secondary btn-sm">Qidirish</button></div>
    </form>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Ism</th><th>Login</th><th>Rol</th><th th:if="${centers != null}">Markaz</th><th>Holat</th><th>Sana</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td class="fw-semibold" th:text="${u.fullName}"></td>
            <td class="text-muted small" th:text="${u.username}"></td>
            <td><span class="badge"
              th:classappend="${u.role.name() == 'SUPER_ADMIN'} ? 'bg-danger' : (${u.role.name() == 'CENTER_ADMIN'} ? 'bg-warning text-dark' : (${u.role.name() == 'TEACHER'} ? 'bg-primary' : 'bg-secondary'))"
              th:text="${u.role.label}"></span></td>
            <td th:if="${centers != null}" class="small" th:text="${u.centerName ?: '—'}"></td>
            <td>
              <span th:if="${u.active}" class="badge bg-success-subtle text-success">Aktiv</span>
              <span th:unless="${u.active}" class="badge bg-danger-subtle text-danger">Bloklangan</span>
            </td>
            <td class="small text-muted" th:text="${#temporals.format(u.createdAt,'dd.MM.yyyy')}"></td>
            <td class="text-end text-nowrap" th:with="self=${u.id == #authentication.principal.id}">
              <a th:href="@{'/admin/users/' + ${u.id} + '/edit'}" class="btn btn-sm btn-outline-secondary py-0" title="Tahrirlash"><i class="bi bi-pencil"></i></a>
              <button class="btn btn-sm btn-outline-secondary py-0" title="Parolni tiklash"
                      th:data-api-url="@{'/api/users/' + ${u.id} + '/reset-password'}" data-api-method="PATCH"
                      th:data-prompt="${u.fullName} + ' uchun yangi parol (kamida 6 belgi)'" data-prompt-field="newPassword"
                      data-success="Parol o'zgartirildi">
                <i class="bi bi-key"></i></button>
              <th:block th:unless="${self}">
                <button th:if="${u.active}" class="btn btn-sm btn-outline-warning py-0" title="Bloklash"
                        th:data-api-url="@{'/api/users/' + ${u.id} + '/block'}" data-api-method="PATCH"
                        th:data-confirm="${u.fullName} + ' bloklansinmi? U tizimga kira olmaydi, ma\'lumotlari saqlanadi.'">
                  <i class="bi bi-lock"></i></button>
                <button th:unless="${u.active}" class="btn btn-sm btn-outline-success py-0" title="Blokdan chiqarish"
                        th:data-api-url="@{'/api/users/' + ${u.id} + '/unblock'}" data-api-method="PATCH">
                  <i class="bi bi-unlock"></i></button>
                <button class="btn btn-sm btn-outline-danger py-0" title="O'chirish"
                        th:data-api-url="@{'/api/users/' + ${u.id}}" data-api-method="DELETE"
                        th:data-confirm="${u.fullName} + ' butunlay o\'chirilsinmi? O\'quvchi bo\'lsa, uning javoblari va natijalari ham o\'chadi. Bu amalni qaytarib bo\'lmaydi.'">
                  <i class="bi bi-trash"></i></button>
              </th:block>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="7" class="text-center text-muted py-4">Hech narsa topilmadi</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main></body>
</html>
