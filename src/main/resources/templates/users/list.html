<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Foydalanuvchilar')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">Foydalanuvchilar</h4>
    <a th:href="@{/admin/users/new}" class="btn btn-primary btn-sm"><i class="bi bi-person-plus me-1"></i>Yangi</a>
  </div>
  <div class="card border-0 shadow-sm mb-3 p-2">
    <form method="get" class="row g-2 align-items-end">
      <div class="col-auto">
        <select name="role" class="form-select form-select-sm">
          <option value="">Barcha rollar</option>
          <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == filter_role}"></option>
        </select>
      </div>
      <div class="col">
        <input type="text" name="search" class="form-control form-control-sm" placeholder="Ism yoki email…" th:value="${filter_search}">
      </div>
      <div class="col-auto"><button class="btn btn-outline-secondary btn-sm">Qidirish</button></div>
    </form>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Ism</th><th>Email</th><th>Rol</th><th>Holat</th><th>Sana</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td class="fw-semibold" th:text="${u.fullName}"></td>
            <td class="text-muted small" th:text="${u.email}"></td>
            <td><span class="badge"
              th:classappend="${u.role.name() == 'SUPER_ADMIN'} ? 'bg-danger' : (${u.role.name() == 'TEACHER'} ? 'bg-primary' : 'bg-secondary')"
              th:text="${u.role}"></span></td>
            <td>
              <span th:if="${u.active}" class="badge bg-success-subtle text-success">Aktiv</span>
              <span th:unless="${u.active}" class="badge bg-danger-subtle text-danger">Bloklangan</span>
            </td>
            <td class="small text-muted" th:text="${#temporals.format(u.createdAt,'dd.MM.yyyy')}"></td>
            <td><a th:href="@{'/admin/users/' + ${u.id} + '/edit'}" class="btn btn-sm btn-outline-secondary py-0"><i class="bi bi-pencil"></i></a></td>
          </tr>
          <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="6" class="text-center text-muted py-4">Hech narsa topilmadi</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main></body>
</html>
