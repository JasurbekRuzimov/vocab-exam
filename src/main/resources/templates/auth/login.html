<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kirish — Examaker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{background:linear-gradient(135deg,#1E3A5F,#2E75B6);min-height:100vh}
    .card{border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="card p-4" style="width:420px">
  <div class="text-center mb-4">
    <i class="bi bi-mortarboard-fill text-primary" style="font-size:3rem"></i>
    <h2 class="fw-bold mt-2" style="color:#1E3A5F">Examaker</h2>
    <p class="text-muted small">O'quv markazlari uchun shaffof imtihonlar</p>
  </div>
  <div th:if="${error}"   class="alert alert-danger small py-2"  th:text="${error}"></div>
  <div th:if="${success}" class="alert alert-success small py-2" th:text="${success}"></div>
  <form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3">
      <label class="form-label fw-semibold">Login</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" name="username" class="form-control" placeholder="masalan: teacher1"
               autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Parol</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="btn w-100 py-2 fw-semibold text-white" style="background:#1E3A5F">
      <i class="bi bi-box-arrow-in-right me-2"></i>Kirish
    </button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
