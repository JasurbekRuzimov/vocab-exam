<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Imtihonlarim')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <h4 class="fw-bold mb-4">Imtihonlarim</h4>
  <div class="row g-3" th:if="${!#lists.isEmpty(assignments)}">
    <div class="col-sm-6 col-lg-4" th:each="a : ${assignments}">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex flex-column">
          <div class="d-flex justify-content-between mb-2">
            <span class="badge" th:classappend="${a.exam.type.name() == 'PDF'} ? 'bg-warning text-dark' : 'bg-info text-dark'" th:text="${a.exam.type}"></span>
            <span class="badge" th:classappend="${a.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'" th:text="${a.status}"></span>
          </div>
          <h6 class="fw-bold flex-grow-1" th:text="${a.exam.title}"></h6>
          <small class="text-muted mb-3" th:if="${a.deadline != null}">
            <i class="bi bi-clock me-1"></i><span th:text="${#temporals.format(a.deadline,'dd.MM.yyyy HH:mm')}"></span>
          </small>
          <a th:if="${a.status.name() == 'ACTIVE' and a.exam.type.name() == 'ONLINE'}"
             th:href="@{'/student/exams/' + ${a.id} + '/take'}" class="btn btn-primary btn-sm w-100">
            <i class="bi bi-pencil-square me-1"></i>Topshirish
          </a>
        </div>
      </div>
    </div>
  </div>
  <div th:if="${#lists.isEmpty(assignments)}" class="text-center py-5 text-muted">
    <i class="bi bi-inbox fs-1 d-block mb-3"></i><p>Hozircha imtihon yo'q</p>
  </div>
</main></body>
</html>
