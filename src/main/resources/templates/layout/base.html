<!DOCTYPE html>
<html lang="uz"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:fragment="layout(content, pageTitle)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf"        th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <script>
    // Barcha o'zgartiruvchi fetch so'rovlariga CSRF tokenni avtomatik qo'shamiz
    (() => {
      const token  = document.querySelector('meta[name="_csrf"]')?.content;
      const header = document.querySelector('meta[name="_csrf_header"]')?.content;
      if (!token || !header) return;
      const nativeFetch = window.fetch.bind(window);
      window.fetch = (input, init = {}) => {
        const method = (init.method || 'GET').toUpperCase();
        if (!['GET', 'HEAD', 'OPTIONS'].includes(method)) {
          const headers = new Headers(init.headers || {});
          if (!headers.has(header)) headers.set(header, token);
          init = { ...init, headers };
        }
        return nativeFetch(input, init);
      };
    })();
  </script>
  <title th:text="${pageTitle != null ? pageTitle + ' — VocabExam' : 'VocabExam'}">VocabExam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex" id="wrapper">

  <nav class="d-flex flex-column flex-shrink-0 p-3 text-white"
       style="width:250px;min-height:100vh;background:#1E3A5F">
    <a th:href="@{/}" class="d-flex align-items-center mb-3 text-white text-decoration-none">
      <i class="bi bi-mortarboard-fill fs-4 me-2"></i>
      <span class="fs-5 fw-bold">VocabExam</span>
    </a>
    <hr class="border-secondary">
    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li><a th:href="@{/}" class="nav-link text-white"><i class="bi bi-speedometer2 me-2"></i>Bosh sahifa</a></li>
      <th:block sec:authorize="hasRole('SUPER_ADMIN')">
        <li class="mt-2"><small class="text-secondary text-uppercase px-2" style="font-size:.7rem">Admin</small></li>
        <li><a th:href="@{/admin/users}"  class="nav-link text-white"><i class="bi bi-people me-2"></i>Foydalanuvchilar</a></li>
        <li><a th:href="@{/admin/groups}" class="nav-link text-white"><i class="bi bi-diagram-3 me-2"></i>Guruhlar</a></li>
      </th:block>
      <th:block sec:authorize="hasAnyRole('TEACHER','SUPER_ADMIN')">
        <li class="mt-2"><small class="text-secondary text-uppercase px-2" style="font-size:.7rem">O'qituvchi</small></li>
        <li><a th:href="@{/teacher/word-sets}" class="nav-link text-white"><i class="bi bi-file-word me-2"></i>So'zlar</a></li>
        <li><a th:href="@{/teacher/exams}"     class="nav-link text-white"><i class="bi bi-journal-check me-2"></i>Imtihonlar</a></li>
      </th:block>
      <th:block sec:authorize="hasRole('STUDENT')">
        <li class="mt-2"><small class="text-secondary text-uppercase px-2" style="font-size:.7rem">O'quvchi</small></li>
        <li><a th:href="@{/student/exams}"   class="nav-link text-white"><i class="bi bi-pencil-square me-2"></i>Imtihonlarim</a></li>
        <li><a th:href="@{/student/results}" class="nav-link text-white"><i class="bi bi-bar-chart me-2"></i>Natijalarim</a></li>
      </th:block>
    </ul>
    <hr class="border-secondary">
    <div class="d-flex align-items-center text-white gap-2">
      <i class="bi bi-person-circle fs-4 flex-shrink-0"></i>
      <div class="flex-grow-1 overflow-hidden">
        <div class="fw-semibold small text-truncate" sec:authentication="name"></div>
        <div style="font-size:.7rem;color:#adb5bd">
          <span sec:authorize="hasRole('SUPER_ADMIN')">Super Admin</span>
          <span sec:authorize="hasRole('TEACHER')">O'qituvchi</span>
          <span sec:authorize="hasRole('STUDENT')">O'quvchi</span>
        </div>
      </div>
      <form th:action="@{/logout}" method="post" class="d-inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="btn p-0 border-0 bg-transparent text-white-50"
                title="Chiqish" style="line-height:1">
          <i class="bi bi-box-arrow-right fs-5"></i>
        </button>
      </form>
    </div>
  </nav>

  <div class="flex-grow-1 d-flex flex-column" style="min-width:0">
    <nav class="d-flex align-items-center bg-white border-bottom px-4 py-2" style="min-height:52px">
      <span class="fw-semibold text-secondary small" th:text="${pageTitle ?: ''}"></span>
      <div class="ms-auto">
        <a th:href="@{/notifications}" class="text-secondary text-decoration-none position-relative">
          <i class="bi bi-bell fs-5"></i>
          <span th:if="${unreadCount != null and unreadCount > 0}"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                style="font-size:.6rem" th:text="${unreadCount}"></span>
        </a>
      </div>
    </nav>
    <main class="p-4 flex-grow-1 bg-light">
      <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show py-2 small">
        <i class="bi bi-check-circle me-1"></i>Muvaffaqiyatli bajarildi
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2 small">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <th:block th:insert="${content}"></th:block>
    </main>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
