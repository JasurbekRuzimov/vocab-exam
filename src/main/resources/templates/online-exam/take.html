<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Imtihon topshirish')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h5 class="fw-bold mb-0" th:text="${assignment.exam.title}"></h5>
      <small class="text-muted" th:if="${assignment.deadline != null}">
        Muddat: <strong th:text="${#temporals.format(assignment.deadline,'dd.MM.yyyy HH:mm')}"></strong>
      </small>
    </div>
    <span id="autoSaveStatus" class="badge bg-secondary">Tayyor</span>
  </div>

  <div class="alert alert-success small py-2 mb-3" th:if="${submitted}">
    <i class="bi bi-check-circle me-1"></i>
    Siz bu imtihonni topshirgansiz. Javoblarni endi o'zgartirib bo'lmaydi.
  </div>

  <div class="alert alert-info small py-2 mb-3" th:unless="${submitted}">
    <i class="bi bi-info-circle me-1"></i>
    Har bir so'zdan foydalanib to'liq inglizcha gap yozing. Javoblar avtomatik saqlanadi.
  </div>

  <div th:each="word, stat : ${words}" class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <div class="d-flex align-items-center gap-3 mb-2">
        <span class="badge bg-primary rounded-circle"
              style="width:28px;height:28px;display:flex;align-items:center;justify-content:center"
              th:text="${stat.count}"></span>
        <span class="fw-bold fs-5 text-primary" th:text="${word.text}"></span>
      </div>
      <!-- th:text bilan oldindan saqlangan javobni to'ldiramiz -->
      <textarea class="form-control answer-input" rows="2"
                th:id="'ans-' + ${word.id}"
                th:data-word-id="${word.id}"
                th:data-assignment-id="${assignment.id}"
                th:text="${savedAnswersMap[word.id.toString()]}"
                th:readonly="${submitted}"
                placeholder="Bu so'zdan foydalanib gap tuzing…"></textarea>
    </div>
  </div>

  <div class="d-flex gap-3 mt-4" th:unless="${submitted}">
    <button id="submitBtn" class="btn btn-success px-4"
            th:data-assignment-id="${assignment.id}">
      <i class="bi bi-send-check me-1"></i>Imtihonni topshirish
    </button>
  </div>

  <script th:unless="${submitted}">
    const assignmentId = document.getElementById('submitBtn').dataset.assignmentId;
    const statusBadge  = document.getElementById('autoSaveStatus');

    async function saveAnswer(ta) {
      statusBadge.textContent = 'Saqlanmoqda…';
      statusBadge.className   = 'badge bg-warning text-dark';
      try {
        const res = await fetch('/api/online-exams/' + assignmentId + '/answers/' + ta.dataset.wordId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answerText: ta.value })
        });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || 'Xato');
        statusBadge.textContent = 'Saqlandi ✓';
        statusBadge.className   = 'badge bg-success';
      } catch {
        statusBadge.textContent = 'Xato';
        statusBadge.className   = 'badge bg-danger';
      }
    }

    // Har 1.5 soniyada avtosaqlash
    document.querySelectorAll('.answer-input').forEach(ta => {
      ta.addEventListener('input', () => {
        // Har bir javob uchun alohida taymer: tez o'tib ketilganda oldingi javob yo'qolmaydi
        clearTimeout(ta.saveTimer);
        ta.saveTimer = setTimeout(() => saveAnswer(ta), 1500);
      });
    });

    // Har 30 soniyada barcha javoblarni saqlash
    setInterval(async () => {
      for (const ta of document.querySelectorAll('.answer-input')) {
        if (ta.value.trim()) await saveAnswer(ta);
      }
    }, 30000);

    // Topshirish
    document.getElementById('submitBtn').addEventListener('click', async () => {
      if (!confirm('Imtihonni topshirasizmi? Keyin o\'zgartirib bo\'lmaydi.')) return;
      for (const ta of document.querySelectorAll('.answer-input')) {
        if (ta.value.trim()) await saveAnswer(ta);
      }
      const res = await fetch('/api/online-exams/' + assignmentId + '/submit', { method: 'POST' });
      if (res.ok) {
        alert('Muvaffaqiyatli topshirildi!');
        window.location.href = '/student/results';
      } else {
        const d = await res.json();
        alert(d.message || 'Xato yuz berdi');
      }
    });
  </script>
</main></body>
</html>
