<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Imtihon topshirish')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h5 class="fw-bold mb-0" th:text="${assignment.exam.title}"></h5>
      <small class="text-muted" th:if="${assignment.deadline != null}">
        Muddat: <strong th:text="${#temporals.format(assignment.deadline,'dd.MM.yyyy HH:mm')}"></strong>
      </small>
    </div>
    <span id="autoSaveStatus" class="badge bg-secondary">Tayyor</span>
  </div>

  <div class="alert alert-success small py-2 mb-3" th:if="${submitted}">
    <i class="bi bi-check-circle me-1"></i>
    Siz bu imtihonni topshirgansiz. Javoblarni endi o'zgartirib bo'lmaydi.
    <a th:href="@{/student/results}" class="alert-link ms-1">Natijalarim</a>
  </div>

  <div th:unless="${submitted}" class="card border-0 shadow-sm mb-3 sticky-top" style="top:8px;z-index:5">
    <div class="card-body py-2">
      <div class="d-flex justify-content-between small mb-1">
        <span><i class="bi bi-info-circle me-1"></i>Javoblar avtomatik saqlanadi.
          <span class="text-muted">Boshqa oynaga o'tsangiz, o'qituvchi buni ko'radi.</span></span>
        <span><strong id="answeredCount">0</strong> / <span th:text="${#lists.size(questions)}"></span> javob berildi</span>
      </div>
      <div class="progress" style="height:6px"><div id="progressBar" class="progress-bar bg-success" style="width:0%"></div></div>
    </div>
  </div>

  <div th:each="q, stat : ${questions}" class="card border-0 shadow-sm mb-3 question"
       th:data-word-id="${q.word.id}" th:data-type="${q.type}">
    <div class="card-body">
      <div class="d-flex align-items-center gap-3 mb-1">
        <span class="badge bg-primary rounded-circle"
              style="width:28px;height:28px;display:flex;align-items:center;justify-content:center"
              th:text="${stat.count}"></span>
        <span class="fw-bold fs-5 text-primary" th:text="${q.prompt}"></span>
      </div>
      <div class="text-muted small mb-2 ms-5" th:text="${q.instruction()}"></div>

      <!-- Test: 4 variant -->
      <div th:if="${q.type.name() == 'MULTIPLE_CHOICE'}" class="row g-2 ms-4">
        <div class="col-sm-6" th:each="opt, os : ${q.options}">
          <input type="radio" class="btn-check answer-input" autocomplete="off"
                 th:name="'q-' + ${q.word.id}" th:id="'q-' + ${q.word.id} + '-' + ${os.index}"
                 th:value="${opt}" th:checked="${savedAnswersMap[q.word.id.toString()] == opt}"
                 th:disabled="${submitted}">
          <label class="btn btn-outline-primary w-100 text-start" th:for="'q-' + ${q.word.id} + '-' + ${os.index}"
                 th:text="${opt}"></label>
        </div>
      </div>

      <!-- Tarjima: bitta qator -->
      <input th:if="${q.type.name() == 'TRANSLATE_EN_UZ' or q.type.name() == 'TRANSLATE_UZ_EN'}"
             type="text" class="form-control answer-input" autocomplete="off" spellcheck="false"
             th:value="${savedAnswersMap[q.word.id.toString()]}" th:readonly="${submitted}"
             th:placeholder="${q.type.name() == 'TRANSLATE_EN_UZ' ? 'Tarjimasini yozing…' : 'Inglizcha so‘zni yozing…'}">

      <!-- Gap tuzish -->
      <textarea th:if="${q.type.name() == 'SENTENCE'}" class="form-control answer-input" rows="2"
                th:text="${savedAnswersMap[q.word.id.toString()]}" th:readonly="${submitted}"
                placeholder="Bu so'zdan foydalanib gap tuzing…"></textarea>
    </div>
  </div>

  <div class="d-flex gap-3 mt-4" th:unless="${submitted}">
    <button id="submitBtn" class="btn btn-success px-4"
            th:data-assignment-id="${assignment.id}">
      <i class="bi bi-send-check me-1"></i>Imtihonni topshirish
    </button>
  </div>

  <script th:unless="${submitted}">
    const assignmentId = document.getElementById('submitBtn').dataset.assignmentId;
    const statusBadge  = document.getElementById('autoSaveStatus');
    const questions    = [...document.querySelectorAll('.question')];

    function valueOf(q) {
      if (q.dataset.type === 'MULTIPLE_CHOICE') return q.querySelector('.answer-input:checked')?.value || '';
      return q.querySelector('.answer-input').value;
    }

    function updateProgress() {
      const done = questions.filter(q => valueOf(q).trim()).length;
      document.getElementById('answeredCount').textContent = done;
      document.getElementById('progressBar').style.width = (100 * done / questions.length) + '%';
    }

    async function saveAnswer(q) {
      statusBadge.textContent = 'Saqlanmoqda…';
      statusBadge.className   = 'badge bg-warning text-dark';
      try {
        const res = await fetch('/api/online-exams/' + assignmentId + '/answers/' + q.dataset.wordId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answerText: valueOf(q) })
        });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || 'Xato');
        statusBadge.textContent = 'Saqlandi ✓';
        statusBadge.className   = 'badge bg-success';
      } catch {
        statusBadge.textContent = 'Xato';
        statusBadge.className   = 'badge bg-danger';
      }
    }

    questions.forEach(q => {
      q.querySelectorAll('.answer-input').forEach(input => {
        if (q.dataset.type === 'MULTIPLE_CHOICE') {
          // Variant tanlanishi bilan darhol saqlaymiz
          input.addEventListener('change', () => { updateProgress(); saveAnswer(q); });
        } else {
          // Har bir javob uchun alohida taymer: tez o'tib ketilganda oldingi javob yo'qolmaydi
          input.addEventListener('input', () => {
            updateProgress();
            clearTimeout(q.saveTimer);
            q.saveTimer = setTimeout(() => saveAnswer(q), 1500);
          });
        }
      });
    });
    updateProgress();

    // Jonli monitoring: o'qituvchi kim imtihonda ekanini va boshqa oynaga o'tishlarni ko'radi
    function signal(event) {
      fetch('/api/online-exams/' + assignmentId + '/activity', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({event}), keepalive: true
      }).catch(() => {});
    }
    setInterval(() => { if (!document.hidden) signal('ping'); }, 30000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) signal('focus-lost'); });

    // Har 30 soniyada barcha javoblarni saqlash
    setInterval(async () => {
      for (const q of questions) if (valueOf(q).trim()) await saveAnswer(q);
    }, 30000);

    // Topshirish
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const empty = questions.filter(q => !valueOf(q).trim()).length;
      const warn = empty ? empty + ' ta savolga javob berilmagan. ' : '';
      if (!confirm(warn + 'Imtihonni topshirasizmi? Keyin o\'zgartirib bo\'lmaydi.')) return;
      for (const q of questions) if (valueOf(q).trim()) await saveAnswer(q);
      const res = await fetch('/api/online-exams/' + assignmentId + '/submit', { method: 'POST' });
      if (res.ok) {
        window.location.href = '/student/results';
      } else {
        const d = await res.json();
        alert(d.message || 'Xato yuz berdi');
      }
    });
  </script>
</main></body>
</html>
