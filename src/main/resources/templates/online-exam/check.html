<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Javoblarni tekshirish')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="fw-bold mb-0" th:text="${assignment.exam.title}"></h5>
    <a th:href="@{'/teacher/exams/' + ${assignment.id} + '/submissions'}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Orqaga</a>
  </div>
  <div th:each="answer : ${answers}" class="card border-0 shadow-sm mb-4" th:id="'card-' + ${answer.id}">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <div>
        <span class="fw-bold text-primary" th:text="${answer.prompt}"></span>
        <span class="badge bg-light text-dark border ms-2" th:text="${answer.questionType.label}"></span>
        <span th:if="${answer.correct != null}" class="badge ms-1"
              th:classappend="${answer.correct} ? 'bg-success' : 'bg-danger'"
              th:text="${answer.correct} ? 'To\'g\'ri' : 'Noto\'g\'ri'"></span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <input type="number" class="form-control form-control-sm score-input" style="width:70px" min="0" max="10"
               th:value="${answer.score}" th:data-answer-id="${answer.id}">
        <button class="btn btn-sm btn-outline-success save-score-btn py-0" th:data-answer-id="${answer.id}"><i class="bi bi-check-lg"></i></button>
      </div>
    </div>
    <div class="card-body">
      <div class="p-3 bg-light rounded mb-2 answer-text" th:text="${answer.answerText ?: '(Javob yozilmagan)'}"></div>
      <div class="small text-success mb-2" th:if="${answer.expectedAnswer != null}">
        <i class="bi bi-check2-circle me-1"></i>To'g'ri javob: <strong th:text="${answer.expectedAnswer}"></strong>
      </div>
      <div class="d-flex gap-2 mb-3" th:if="${answer.answerText != null and !answer.questionType.autoGraded}">
        <input type="number" placeholder="Bosh" class="form-control form-control-sm" style="width:80px" th:id="'s-' + ${answer.id}">
        <input type="number" placeholder="Oxir" class="form-control form-control-sm" style="width:80px" th:id="'e-' + ${answer.id}">
        <input type="text" placeholder="Izoh" class="form-control form-control-sm" th:id="'c-' + ${answer.id}">
        <input type="text" placeholder="To'g'risi" class="form-control form-control-sm" th:id="'h-' + ${answer.id}">
        <button class="btn btn-sm btn-outline-danger add-error-btn py-0" th:data-answer-id="${answer.id}"><i class="bi bi-plus-circle"></i></button>
      </div>
      <div th:each="err : ${answer.errors}" class="d-flex align-items-start gap-2 p-2 mb-2 border rounded bg-danger-subtle small" th:id="'err-' + ${err.id}">
        <i class="bi bi-exclamation-circle text-danger mt-1"></i>
        <div class="flex-grow-1">
          <span class="text-danger fw-semibold" th:text="'[' + ${err.errorStart} + '-' + ${err.errorEnd} + '] '"></span>
          <span th:text="${err.comment}"></span>
          <span th:if="${err.correctHint}" class="text-success ms-2" th:text="'→ ' + ${err.correctHint}"></span>
        </div>
        <button class="btn btn-sm text-danger p-0 border-0 bg-transparent delete-error-btn"
                th:data-error-id="${err.id}" th:data-answer-id="${answer.id}"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>
  </div>
  <div class="card border-0 shadow-sm mt-4">
    <div class="card-body">
      <h6 class="fw-semibold mb-3">Yakuniy natija</h6>
      <div class="row g-3">
        <div class="col-sm-3"><label class="form-label small">Jami ball</label><input type="number" id="totalScore" class="form-control form-control-sm" min="0" th:value="${scoreSum}"></div>
        <div class="col-sm-3"><label class="form-label small">Maksimal ball</label><input type="number" id="maxScore" class="form-control form-control-sm" th:value="${scoreMax > 0 ? scoreMax : 100}"></div>
        <div class="col-sm-6"><label class="form-label small">Izoh</label><input type="text" id="resultComment" class="form-control form-control-sm"></div>
        <div class="col-12">
          <button id="saveResultBtn" class="btn btn-success btn-sm"
                  th:data-assignment-id="${assignment.id}" th:data-student-id="${studentId}">
            <i class="bi bi-check-circle me-1"></i>Natijani saqlash
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll('.add-error-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.answerId;
        const body = {errorStart:+document.getElementById('s-'+id).value, errorEnd:+document.getElementById('e-'+id).value,
          comment:document.getElementById('c-'+id).value, correctHint:document.getElementById('h-'+id).value||null};
        const res = await fetch('/api/answers/'+id+'/errors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if (res.ok) location.reload(); else { const d=await res.json(); alert(d.message); }
      });
    });
    document.querySelectorAll('.delete-error-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        await fetch('/api/answers/'+btn.dataset.answerId+'/errors/'+btn.dataset.errorId,{method:'DELETE'});
        document.getElementById('err-'+btn.dataset.errorId)?.remove();
      });
    });
    document.querySelectorAll('.save-score-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.answerId;
        const score = +document.querySelector('.score-input[data-answer-id="'+id+'"]').value;
        await fetch('/api/answers/'+id+'/score',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({score})});
        btn.innerHTML='<i class="bi bi-check-all"></i>';
        // Jami ballni savollar ballari yig'indisi bilan yangilaymiz
        document.getElementById('totalScore').value =
          [...document.querySelectorAll('.score-input')].reduce((sum, i) => sum + (+i.value || 0), 0);
      });
    });
    document.getElementById('saveResultBtn').addEventListener('click', async () => {
      const {assignmentId, studentId} = document.getElementById('saveResultBtn').dataset;
      const body = {totalScore:+document.getElementById('totalScore').value, maxScore:+document.getElementById('maxScore').value,
        comment:document.getElementById('resultComment').value||null};
      const res = await fetch('/api/online-exams/'+assignmentId+'/submissions/'+studentId+'/result',
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if (res.ok) { alert('Natija saqlandi!'); history.back(); }
      else { const d=await res.json(); alert(d.message); }
    });
  </script>
</main></body>
</html>
