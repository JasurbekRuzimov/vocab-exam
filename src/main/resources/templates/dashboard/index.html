<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Bosh sahifa')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<body>
<main>
  <h4 class="fw-bold mb-4">Xush kelibsiz! <span sec:authentication="name"></span></h4>

  <sec:authorize access="hasRole('SUPER_ADMIN')">
    <div class="row g-3 mb-4">
      <div class="col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm text-center p-3">
          <i class="bi bi-people-fill fs-1 text-primary mb-2"></i>
          <h3 class="fw-bold" th:text="${stats?.get('totalStudents') ?: 0}">0</h3>
          <small class="text-muted">O'quvchilar</small>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm text-center p-3">
          <i class="bi bi-person-workspace fs-1 text-success mb-2"></i>
          <h3 class="fw-bold" th:text="${stats?.get('totalTeachers') ?: 0}">0</h3>
          <small class="text-muted">O'qituvchilar</small>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm text-center p-3">
          <i class="bi bi-journal-check fs-1 text-warning mb-2"></i>
          <h3 class="fw-bold" th:text="${stats?.get('totalExams') ?: 0}">0</h3>
          <small class="text-muted">Imtihonlar</small>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm text-center p-3">
          <i class="bi bi-bar-chart-fill fs-1 text-info mb-2"></i>
          <h3 class="fw-bold" th:text="${stats?.get('totalResults') ?: 0}">0</h3>
          <small class="text-muted">Natijalar</small>
        </div>
      </div>
    </div>
  </sec:authorize>

  <sec:authorize access="hasRole('STUDENT')">
    <div class="row g-3 mb-4">
      <div class="col-sm-4">
        <div class="card border-0 shadow-sm text-center p-3">
          <i class="bi bi-journal-text fs-1 text-primary mb-2"></i>
          <h3 class="fw-bold" th:text="${stats?.get('totalExams') ?: 0}">0</h3>
          <small class="text-muted">Topshirilgan imtihonlar</small>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="card border-0 shadow-sm text-center p-3">
          <i class="bi bi-trophy-fill fs-1 text-warning mb-2"></i>
          <h3 class="fw-bold" th:text="${stats?.get('avgScore') != null ? #numbers.formatDecimal(stats.get('avgScore'),1,1) : '—'}">—</h3>
          <small class="text-muted">O'rtacha ball</small>
        </div>
      </div>
      <div class="col-sm-4">
        <a th:href="@{/student/exams}" class="card border-0 shadow-sm text-center p-3 text-decoration-none text-dark d-block">
          <i class="bi bi-pencil-square fs-1 text-success mb-2"></i>
          <div class="fw-semibold">Imtihon topshirish</div>
        </a>
      </div>
    </div>
  </sec:authorize>

  <sec:authorize access="hasAnyRole('TEACHER','SUPER_ADMIN')">
    <h6 class="text-muted mb-3">Tezkor harakatlar</h6>
    <div class="row g-3">
      <div class="col-sm-4">
        <a th:href="@{/teacher/word-sets/upload}" class="card border-0 shadow-sm p-3 text-decoration-none text-dark d-flex flex-row align-items-center gap-3">
          <i class="bi bi-upload fs-3 text-primary"></i>
          <div><div class="fw-semibold">So'zlar yuklash</div><small class="text-muted">.txt yoki .docx</small></div>
        </a>
      </div>
      <div class="col-sm-4">
        <a th:href="@{/teacher/exams/create}" class="card border-0 shadow-sm p-3 text-decoration-none text-dark d-flex flex-row align-items-center gap-3">
          <i class="bi bi-plus-circle fs-3 text-success"></i>
          <div><div class="fw-semibold">Imtihon yaratish</div><small class="text-muted">PDF yoki Online</small></div>
        </a>
      </div>
      <div class="col-sm-4">
        <a th:href="@{/teacher/exams}" class="card border-0 shadow-sm p-3 text-decoration-none text-dark d-flex flex-row align-items-center gap-3">
          <i class="bi bi-list-check fs-3 text-warning"></i>
          <div><div class="fw-semibold">Barcha imtihonlar</div></div>
        </a>
      </div>
    </div>
  </sec:authorize>
</main>
</body>
</html>
