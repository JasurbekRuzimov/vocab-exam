<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::main}, 'Natija')}"
      lang="uz" xmlns:th="http://www.thymeleaf.org">
<body><main>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="fw-bold mb-0" th:text="${result.assignment.exam.title}"></h5>
    <a th:href="@{/student/results}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Orqaga</a>
  </div>
  <div class="row g-3">
    <div class="col-sm-4">
      <div class="card border-0 shadow-sm text-center p-4">
        <div class="display-4 fw-bold text-primary" th:text="${result.totalScore}"></div>
        <div class="text-muted">/ <span th:text="${result.maxScore}"></span> ball</div>
      </div>
    </div>
    <div class="col-sm-8">
      <div class="card border-0 shadow-sm p-3 h-100">
        <div class="fw-semibold mb-2">O'qituvchi izohi:</div>
        <p class="text-muted mb-0" th:text="${result.comment ?: 'Izoh qoldirilmagan'}"></p>
        <small class="text-muted mt-3 d-block" th:text="'Tekshirildi: ' + ${#temporals.format(result.checkedAt,'dd.MM.yyyy HH:mm')}"></small>
      </div>
    </div>
  </div>

  <!-- Shaffoflik: natija e'lon qilingandan keyingi har bir o'zgarish -->
  <div class="card border-0 shadow-sm mt-3" th:if="${!#lists.isEmpty(changes)}">
    <div class="card-header bg-white fw-semibold"><i class="bi bi-clock-history me-1"></i>Ball o'zgarishlari</div>
    <div class="list-group list-group-flush">
      <div class="list-group-item small" th:each="c : ${changes}">
        <div class="d-flex justify-content-between">
          <span><span class="text-muted text-decoration-line-through" th:text="${c.oldScore} + '/' + ${c.oldMax}"></span>
            → <strong th:text="${c.newScore} + '/' + ${c.newMax}"></strong></span>
          <span class="text-muted" th:text="${#temporals.format(c.changedAt,'dd.MM.yyyy HH:mm')}"></span>
        </div>
        <div>Sabab: <span th:text="${c.reason}"></span>
          <span class="text-muted" th:if="${c.changedByName}" th:text="'— ' + ${c.changedByName}"></span></div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm mt-4" th:if="${!#lists.isEmpty(answers)}">
    <div class="card-header bg-white fw-semibold">Savollar bo'yicha</div>
    <div class="list-group list-group-flush">
      <div class="list-group-item" th:each="a, st : ${answers}">
        <div class="d-flex justify-content-between align-items-start gap-2">
          <div class="flex-grow-1">
            <div>
              <span class="text-muted small me-1" th:text="${st.count} + '.'"></span>
              <span class="fw-semibold" th:text="${a.prompt}"></span>
              <span class="badge bg-light text-dark border ms-1" th:text="${a.questionType.label}"></span>
            </div>
            <div class="mt-1" th:if="${a.questionType.autoGraded or #lists.isEmpty(a.errors)}">
              <span class="small text-muted">Sizning javobingiz:</span>
              <span th:text="${a.answerText ?: '(javob berilmagan)'}"
                    th:classappend="${a.correct == false} ? 'text-danger text-decoration-line-through' : ''"></span>
            </div>
            <!-- Gap tuzish: o'qituvchi belgilagan xato joylari matn ichida ko'rsatiladi -->
            <div class="mt-1" th:unless="${a.questionType.autoGraded or #lists.isEmpty(a.errors)}">
              <span class="small text-muted">Sizning javobingiz:</span>
              <span class="answer-text"><th:block th:each="seg : ${a.segments}"><span
                    th:if="${seg.error != null}" class="error-highlight"
                    th:title="${seg.error.comment}" th:text="${seg.text}"></span><th:block
                    th:if="${seg.error == null}" th:text="${seg.text}"></th:block></th:block></span>
            </div>
            <div class="small text-success" th:if="${a.expectedAnswer != null and (a.correct != true or !#strings.equalsIgnoreCase(#strings.trim(a.answerText), a.expectedAnswer))}">
              To'g'ri javob: <strong th:text="${a.expectedAnswer}"></strong>
            </div>
            <div class="small mt-1" th:each="err : ${a.errors}">
              <i class="bi bi-exclamation-circle text-danger me-1"></i>
              <span th:if="${err.categoryLabel}" class="badge bg-danger err-cat me-1" th:text="${err.categoryLabel}"></span>
              <span class="fw-semibold" th:if="${a.answerText != null and err.errorEnd <= #strings.length(a.answerText)}"
                    th:text="'«' + ${#strings.substring(a.answerText, err.errorStart, err.errorEnd)} + '»'"></span>
              <span th:if="${err.comment != err.categoryLabel}" th:text="${err.comment}"></span>
              <span th:if="${err.correctHint}" class="text-success ms-1" th:text="'→ ' + ${err.correctHint}"></span>
            </div>
          </div>
          <div class="text-end text-nowrap">
            <i th:if="${a.correct == true}"  class="bi bi-check-circle-fill text-success"></i>
            <i th:if="${a.correct == false}" class="bi bi-x-circle-fill text-danger"></i>
            <span class="fw-bold ms-1" th:text="${a.score != null ? a.score : '–'}"></span><span class="text-muted small">/10</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</main></body>
</html>
