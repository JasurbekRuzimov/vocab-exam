version: '3.9'

services:
  db:
    image: postgres:17-alpine
    container_name: vocabexam_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vocabexam
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: vocabexam_app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/vocabexam
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SCHOOL_NAME: ${SCHOOL_NAME:-VocabExam}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vocabexam.uz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - pdfs:/app/pdfs

volumes:
  pgdata:
  uploads:
  pdfs:
